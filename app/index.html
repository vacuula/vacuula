<!doctype html>
<html lang="en" data-theme="dark" data-accent="mint" data-style="menthe">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0f1113" />
    <script>
      // Applies the stored theme before any stylesheet or bundle loads, so a
      // reload never flashes the wrong background. Keys and background values
      // must match src/theme/index.ts and src/theme/theme.css.
      (function () {
        var mode = 'dark', accent = 'mint', style = 'menthe';
        try {
          mode = localStorage.getItem('vacuula.theme') || mode;
          accent = localStorage.getItem('vacuula.accent') || accent;
          style = localStorage.getItem('vacuula.style') || style;
        } catch (e) {}
        var bgs = { dark: '#0f1113', soft: '#25292e', light: '#f4f6f5' };
        var styleBgs = { nordique: { dark: '#111513', soft: '#111513', light: '#f7f8f7' } };
        if (!bgs[mode]) mode = 'dark';
        var bg = (styleBgs[style] && styleBgs[style][mode]) || bgs[mode];
        var html = document.documentElement;
        html.setAttribute('data-theme', mode);
        html.setAttribute('data-accent', accent);
        html.setAttribute('data-style', style);
        html.style.backgroundColor = bg;
        html.style.colorScheme = mode === 'light' ? 'light' : 'dark';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', bg);
      })();
    </script>
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%icons/favicon-vacuula-32.png" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon-vacuula.svg" />
    <link rel="manifest" href="%BASE_URL%manifest-vacuula.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon-vacuula.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vacuula" />
    <title>Vacuula</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
