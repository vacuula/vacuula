[project]
name = "vacuula-server"
version = "1.1.1-b4"
description = "Install Vacuula on your Neato robot"
authors = [
    {   name = "Philip", email = "philipmagyar@proton.me" },
    {   name = "Jairo", email = "diasjairo@hotmail.com" }
]
requires-python = "==3.14.*"
dependencies = [
    "alembic==1.18.4",
    "greenlet==3.5.1",
    "ifaddr==0.2.0",
    "mako==1.3.12",
    "markupsafe==3.0.3",
    "numpy>=2.3.2,<2.4",
    "pillow==12.2.0",
    "sqlalchemy==2.0.50",
    "typing-extensions==4.15.0",
    "tzdata==2026.5",
    "tzlocal==5.4.4",
    "zeroconf==0.151.3",
]

[project.scripts]
vacuula-server = "vacuula_server:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[tool.ruff]
extend-exclude = ["data", "data-dev", "web"]