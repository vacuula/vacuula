# config for Home Assistant add-on
name: Vacuula - BETA
version: "1.1.1-b4"
slug: vacuula-beta
description: latest beta of Vacuula
url: "https://github.com/vacuula/vacuula"
arch:
  - aarch64
  - amd64
init: false
host_network: true
boot: auto
image: "ghcr.io/vacuula/vacuula"

ingress: true
ingress_port: 0
panel_icon: mdi:robot-vacuum-variant-alert

map:
  - type: addon_config
    read_only: false
    path: /server/data

options:
  GEN3_PORT: 335
  GEN4_PORT: 3443
  VACUULA_PORT: 8050
  GEN3_ENABLED: true
  GEN4_ENABLED: true
  MDNS_ENABLED: true
  HA_INGRESS: true
  LOG_LEVEL: "info"

schema:
  GEN3_PORT: int(100,999)
  GEN4_PORT: int
  VACUULA_PORT: int
  GEN3_ENABLED: bool
  GEN4_ENABLED: bool
  MDNS_ENABLED: bool
  LOG_LEVEL: "list(debug|info|warning|error)?"
  HA_INGRESS: "bool?"
  TZ: "str?"
  HOST_IP: "str?"