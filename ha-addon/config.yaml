# config for Home Assistant add-on
name: Vacuula
version: "latest"
slug: vacuula
description: custom server for the undead robot vacuum cleaners - revive your Neato with the power of Vacuula
url: "https://github.com/vacuula/vacuula"
arch:
  - aarch64
  - amd64
init: false
host_network: true
webui: "http://[HOST]:[PORT:80]"
# Port metadata for the Web UI link; host networking still uses VACUULA_PORT.
ports:
  80/tcp: 80
boot: auto
image: "ghcr.io/vacuula/vacuula"

map:
  - type: addon_config
    read_only: false
    path: /server/data

options:
  # GEN3_PORT: 335
  GEN4_PORT: 3443
  VACUULA_PORT: 80
  GEN3_ENABLED: true
  GEN4_ENABLED: true
  MDNS_ENABLED: true
  # HOST_IP: "0.0.0.0"

schema:
  # GEN3_PORT: int
  GEN4_PORT: int
  VACUULA_PORT: int
  GEN3_ENABLED: bool
  GEN4_ENABLED: bool
  MDNS_ENABLED: bool
  # TZ: str
  # HOST_IP: str