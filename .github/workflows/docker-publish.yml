name: Docker build & release

# Trigger via commit message:
#   dbuild:2.3.1-b1             -> build + push image tagged 2.3.1-b1 AND beta
#   dbuild:2.3.1-b1+test-thing  -> build + push image tagged 2.3.1-b1-test-thing only (custom build, "+" becomes "-" in docker tags)
#   dbuild:1.0.0                -> build + push image tagged 1.0.0 AND latest
#   release:1.0.0               -> same as dbuild, plus a GitHub Release with docker-compose.yaml attached
# When using release, making a beta (-bX) or custom build (+...) it will make a prerelease, if not, it will make a draft release to be published

on:
  push:
    branches: [main, 'custom/**']

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Parse commit message
        id: parse
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          version=""
          release=false

          if [[ "$COMMIT_MSG" =~ release:([0-9A-Za-z._+-]+) ]]; then
            version="${BASH_REMATCH[1]}"
            release=true
          elif [[ "$COMMIT_MSG" =~ dbuild:([0-9A-Za-z._+-]+) ]]; then
            version="${BASH_REMATCH[1]}"
          fi

          # strep
          version="${version%%[._-]}"

          if [[ -z "$version" ]]; then
            echo "No dbuild:/release: tag in commit message, nothing to do."
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # X.X.X -> draft release, anything else (2.3.1-b1, 2.3.1+test etc.) -> pre-release
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            latest=true
            prerelease=false
          else
            latest=false
            prerelease=true
          fi

          # only a plain X.X.X-bX moves the :beta tag, custom builds (+...) don't
          beta=false
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-b[0-9]+$ ]]; then
            beta=true
          fi

          echo "version=$version"       >> "$GITHUB_OUTPUT"
          echo "tag=${version//+/-}"    >> "$GITHUB_OUTPUT"   # docker tags can't contain "+"
          echo "release=$release"       >> "$GITHUB_OUTPUT"
          echo "latest=$latest"         >> "$GITHUB_OUTPUT"
          echo "beta=$beta"             >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Parsed: version=$version release=$release latest=$latest beta=$beta"

      - name: Checkout
        if: steps.parse.outputs.version != ''
        uses: actions/checkout@v7

      - name: Check pyproject version matches
        if: steps.parse.outputs.version != ''
        env:
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          py_version="$(sed -nE 's/^version = "(.*)"/\1/p' server/pyproject.toml | head -1)"
          if [[ "$py_version" != "$VERSION" ]]; then
            echo "::error::server/pyproject.toml is '$py_version' but the commit message says '$VERSION'. Is the post-commit hook enabled?"
            exit 1
          fi

      - name: Set image name (lowercase)
        if: steps.parse.outputs.version != ''
        id: img
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for rpi)
        if: steps.parse.outputs.version != ''
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        if: steps.parse.outputs.version != ''
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.parse.outputs.version != ''
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.parse.outputs.version != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          # Version format: X.X.X[-bX][+build info]
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.parse.outputs.tag }}
            ${{ steps.parse.outputs.latest == 'true' && format('{0}:latest', steps.img.outputs.name) || '' }}
            ${{ steps.parse.outputs.beta == 'true' && format('{0}:beta', steps.img.outputs.name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        if: steps.parse.outputs.version != '' && steps.parse.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.parse.outputs.version }}
          TAG: ${{ steps.parse.outputs.tag }}
          PRERELEASE: ${{ steps.parse.outputs.prerelease }}
          IMAGE: ${{ steps.img.outputs.name }}
        run: |
          if [[ "$PRERELEASE" == "true" ]]; then
            flag="--prerelease"   # e.g. 2.3.1-bX: published right away as a pre-release
          else
            flag="--draft"        # e.g. 1.0.0: stays hidden until you publish it
          fi

          gh release create "v$VERSION" \
            build/docker/docker-compose.yaml \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes "Docker image: \`$IMAGE:$TAG\`" \
            $flag